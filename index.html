<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>دليلك الجامعي | منصتك التعليمية الأكاديمية الشاملة</title>
    <meta name="description" content="دليل رقمي متكامل للطلاب الجامعيين لتنظيم الدراسة، الجداول الدراسية، المحاضرات، والمكتبة المرئية" />
    
    <!-- PWA Primary Theme & Background Colors -->
    <meta name="theme-color" content="#071A3D" />
    <meta name="background-color" content="#071A3D" />

    <!-- Apple iOS PWA Capabilities & Splash Screen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="دليلك الجامعي" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="دليلك الجامعي" />

    <!-- PWA Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#16958E" />

    <!-- Capture native PWA install event before any other bundle code executes -->
    <script>
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });
    </script>
    
    <!-- Google Fonts for Modern Arabic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-cairo antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
